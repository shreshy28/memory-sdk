[project]
name = "memory-sdk-workspace"
version = "0.1.0"
description = "Portable memory platform engineering workspace"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "mypy>=1.18.2",
  "pytest>=8.4.2",
  "pytest-asyncio>=1.2.0",
  "ruff>=0.13.2",
]

[tool.uv.workspace]
members = [
  "apps/api",
  "apps/worker",
  "packages/domain",
  "packages/application",
  "packages/persistence-postgres",
  "packages/providers",
  "packages/retrieval",
  "packages/telemetry",
  "packages/sdk-python",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = [
  "memory_api",
  "memory_worker",
  "memory_domain",
  "memory_application",
  "memory_postgres",
  "memory_providers",
  "memory_retrieval",
  "memory_telemetry",
  "memory_sdk",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests/unit"]
asyncio_mode = "auto"
