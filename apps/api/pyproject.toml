[project]
name = "memory-api"
version = "0.1.0"
description = "FastAPI composition root for the memory platform"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.118.0",
  "memory-application",
  "memory-domain",
  "memory-postgres",
  "pydantic-settings>=2.11.0",
  "uvicorn[standard]>=0.37.0",
]

[tool.uv.sources]
memory-application = { workspace = true }
memory-domain = { workspace = true }
memory-postgres = { workspace = true }

[project.scripts]
memory-api = "memory_api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_api"]
