[project]
name = "memory-worker"
version = "0.1.0"
description = "Leased background worker composition root"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.118.0",
  "memory-application",
  "memory-domain",
  "memory-postgres",
  "pydantic-settings>=2.11.0",
  "uvicorn[standard]>=0.37.0",
]

[tool.uv.sources]
memory-application = { workspace = true }
memory-domain = { workspace = true }
memory-postgres = { workspace = true }

[project.scripts]
memory-worker = "memory_worker.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_worker"]
