[project]
name = "memory-telemetry"
version = "0.1.0"
description = "OpenTelemetry and redaction adapters"
requires-python = ">=3.13"
dependencies = ["memory-application", "opentelemetry-api>=1.37.0"]

[tool.uv.sources]
memory-application = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_telemetry"]
