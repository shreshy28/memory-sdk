[project]
name = "memory-retrieval"
version = "0.1.0"
description = "Retrieval, ranking, and context packing adapters"
requires-python = ">=3.13"
dependencies = ["memory-application", "memory-domain"]

[tool.uv.sources]
memory-application = { workspace = true }
memory-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_retrieval"]
