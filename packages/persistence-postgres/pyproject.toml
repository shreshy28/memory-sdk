[project]
name = "memory-postgres"
version = "0.1.0"
description = "PostgreSQL persistence adapter for the memory platform"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.16.5",
  "asyncpg>=0.30.0",
  "memory-application",
  "memory-domain",
  "sqlalchemy[asyncio]>=2.0.43",
]

[tool.uv.sources]
memory-application = { workspace = true }
memory-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_postgres"]
