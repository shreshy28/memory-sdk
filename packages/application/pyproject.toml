[project]
name = "memory-application"
version = "0.1.0"
description = "Memory platform use cases and ports"
requires-python = ">=3.13"
dependencies = ["memory-domain"]

[tool.uv.sources]
memory-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_application"]
