[project]
name = "memory-providers"
version = "0.1.0"
description = "Model and embedding provider adapters"
requires-python = ">=3.13"
dependencies = ["memory-application"]

[tool.uv.sources]
memory-application = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_providers"]
