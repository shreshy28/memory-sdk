name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --all-packages --dev --frozen
      - run: make lint typecheck test-unit architecture-check

  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/console/pnpm-lock.yaml
      - run: pnpm --dir apps/console install --frozen-lockfile
      - run: pnpm --dir apps/console build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --all-packages --dev --frozen
      - run: docker compose -f deploy/compose.yaml config
      - run: docker compose -f deploy/compose.yaml up -d --build --wait
      - run: make smoke-health
      - run: docker compose -f deploy/compose.yaml stop api worker
      - run: docker compose -f deploy/compose.yaml run --rm --no-deps api uv run alembic -c packages/persistence-postgres/alembic.ini downgrade 0001_baseline
      - run: docker compose -f deploy/compose.yaml run --rm --no-deps api uv run alembic -c packages/persistence-postgres/alembic.ini upgrade head
      - run: uv run pytest tests/integration/test_postgres_hybrid_retrieval.py -q
